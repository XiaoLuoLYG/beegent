name: Android compile
on:
  push:
    branches: [android]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile Android sources
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:compileDebugUnitTestKotlin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: beegent-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
