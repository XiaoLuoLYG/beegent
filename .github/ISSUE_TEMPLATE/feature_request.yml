name: 功能建议 / Feature request
description: 分享一个值得解决的移动端工作场景
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你正在做什么，现有方式遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的体验 / Proposed experience
      description: 描述最小可用的改进，以及考虑过的替代方法。
    validations:
      required: true
